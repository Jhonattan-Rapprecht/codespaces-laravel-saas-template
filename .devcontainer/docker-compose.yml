version: "3.9"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8082:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-..}:/workspace:cached
    command: sleep infinity
    depends_on:
      - mysql
      - redis
      - mailpit
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    networks:
      - traefik

  queue-worker:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-..}:/workspace:cached
    command: php /workspace/artisan queue:work --tries=3
    depends_on:
      - redis
      - mysql
    networks:
      - traefik

  scheduler:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-..}:/workspace:cached
    command: php /workspace/artisan schedule:work
    depends_on:
      - redis
      - mysql
    networks:
      - traefik

  horizon:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-..}:/workspace:cached
    command: php /workspace/artisan horizon
    depends_on:
      - redis
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.horizon.rule=Host(`horizon.localhost`)"
      - "traefik.http.services.horizon.loadbalancer.server.port=9001"
    networks:
      - traefik

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - traefik

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`pma.localhost`)"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
    networks:
      - traefik

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - traefik

  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - traefik

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`sso.localhost`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - traefik

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    volumes:
      - minio-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.localhost`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    networks:
      - traefik

  meilisearch:
    image: getmeili/meilisearch:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meili.rule=Host(`search.localhost`)"
      - "traefik.http.services.meili.loadbalancer.server.port=7700"
    networks:
      - traefik

volumes:
  mysql-data:
  minio-data:

networks:
  traefik:
    driver: bridge
