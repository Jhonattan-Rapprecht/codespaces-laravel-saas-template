version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - mailpit

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    entrypoint:
      - /bin/sh
      - /opt/keycloak/keycloak-entrypoint.sh
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-dev-admin}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:-Demo-Sso-Pass-1}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak-entrypoint.sh:/opt/keycloak/keycloak-entrypoint.sh:ro
      - ./keycloak/realm-template:/opt/keycloak/realm-template:ro
      - keycloak-data:/opt/keycloak/data

volumes:
  mysql-data:
  keycloak-data: